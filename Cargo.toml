[package]
name = "slopio-tls"
version = "0.1.0"
edition = "2024"
description = "TLS 1.3 for the slopio runtime, with the record layer in the kernel (kTLS)"
keywords = ["tls", "ktls", "rustls", "io-uring", "slopio"]
categories = ["network-programming", "cryptography", "os::linux-apis"]
license = "MIT"
repository = "https://github.com/slopio/slopio-tls"
readme = "README.md"

[dependencies]
slopio = "0.1"
libc = "0.2"
rustls = "0.23.36"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.13", features = ["aws_lc_rs"] }
